services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
      POSTGRES_DB: eve_diagnostics
    ports:
      - "5432:5432"
    volumes:
      - eve_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://eve:eve@db:5432/eve_diagnostics
      JWT_SECRET_KEY: docker-compose-dev-secret-change-me
      WEBHOOK_SHARED_SECRET: dev-webhook-secret
    depends_on:
      db:
        condition: service_healthy

volumes:
  eve_pgdata:
